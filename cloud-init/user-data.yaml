#cloud-config
# Distro-agnostic first-boot trigger. Works on Ubuntu, Debian, Rocky, Alma,
# RHEL, CentOS, and Fedora: cloud-init creates the user, and the host bootstrap
# installs Docker and starts the dev container.
#
# Never put private keys or tokens in this file: user-data is readable from
# inside the VM through the metadata service.

hostname: dev-env
manage_etc_hosts: true
package_update: true
package_upgrade: false

packages:
  - git
  - curl
  - ca-certificates

ssh_pwauth: false

users:
  - name: aniket
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  dev-env

runcmd:
  - [sudo, -u, aniket, -H, bash, -c, "git clone --depth 1 https://github.com/Coder02Aniket/dev-env.git /home/aniket/dev-env && /home/aniket/dev-env/bootstrap-host.sh"]
  - [touch, /var/lib/dev-env.ready]

final_message: "dev-env ready in $UPTIME seconds"
