#cloud-config
# First-boot trigger. Replace the SSH key and repo URL, then paste this into
# your provider's user-data field when creating the VM.
#
# Never put private keys, tokens, or passwords in this file: user-data is
# readable from inside the VM through the metadata service.

hostname: dev-env
manage_etc_hosts: true
package_update: true
package_upgrade: false

packages:
  - git
  - curl
  - ca-certificates

ssh_pwauth: false

users:
  - name: aniket
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...REPLACE_WITH_YOUR_PUBLIC_KEY

runcmd:
  - [sudo, -u, aniket, -H, git, clone, --depth, 1, https://github.com/Coder02Aniket/dev-env.git, /home/aniket/dev-env]
  - [sudo, -u, aniket, -H, bash, /home/aniket/dev-env/bootstrap.sh]
  - [touch, /var/lib/dev-env.ready]

final_message: "dev-env ready in $UPTIME seconds"
